[project]
name = "sidekick"
version = "0.1.0"
description = "Sidekick backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "migrations", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not eval'"
markers = ["eval: answer-quality evals on a live model, spend quota; run with -m eval"]
